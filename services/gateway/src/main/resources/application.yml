spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
              - Path=/api/customers/**
              filters:
                - AddResponseHeader=X-Served-By, api-gateway
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
